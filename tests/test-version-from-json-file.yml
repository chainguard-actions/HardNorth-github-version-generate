name: Test version extraction from JSON file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version-source: file
          version-file: '${{ github.workspace }}/tests/fixtures/package.json'
          version-file-extraction-pattern: '"version":\s*"([^"]+)"'
      - name: Assert CURRENT_VERSION extracted from JSON
        env:
          ACTUAL: ${{ steps.action.outputs.CURRENT_VERSION }}
        run: |
          echo "actual CURRENT_VERSION: $ACTUAL"
          if [ "$ACTUAL" != "4.1.2-SNAPSHOT" ]; then
            echo "FAIL: expected '4.1.2-SNAPSHOT', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
      - name: Assert RELEASE_VERSION snapshot removed
        env:
          ACTUAL: ${{ steps.action.outputs.RELEASE_VERSION }}
        run: |
          echo "actual RELEASE_VERSION: $ACTUAL"
          if [ "$ACTUAL" != "4.1.2" ]; then
            echo "FAIL: expected '4.1.2', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
