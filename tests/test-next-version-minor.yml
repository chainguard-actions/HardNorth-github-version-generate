name: Test next version minor increment
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version-source: variable
          version: '1.2.3-SNAPSHOT'
          next-version-increment-minor: 'true'
      - name: Assert NEXT_VERSION incremented minor
        env:
          ACTUAL: ${{ steps.action.outputs.NEXT_VERSION }}
        run: |
          echo "actual NEXT_VERSION: $ACTUAL"
          if [ "$ACTUAL" != "1.3.0-SNAPSHOT" ]; then
            echo "FAIL: expected '1.3.0-SNAPSHOT' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
