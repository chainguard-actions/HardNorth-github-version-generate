name: Test prerelease cut from release version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version-source: variable
          version: '1.5.0-alpha.1'
          release-version-cut-snapshot: 'false'
          release-version-cut-prerelease: 'true'
      - name: Assert CURRENT_VERSION unchanged
        env:
          ACTUAL: ${{ steps.action.outputs.CURRENT_VERSION }}
        run: |
          echo "actual CURRENT_VERSION: $ACTUAL"
          if [ "$ACTUAL" != "1.5.0-alpha.1" ]; then
            echo "FAIL: expected '1.5.0-alpha.1', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
      - name: Assert RELEASE_VERSION has prerelease removed
        env:
          ACTUAL: ${{ steps.action.outputs.RELEASE_VERSION }}
        run: |
          echo "actual RELEASE_VERSION: $ACTUAL"
          if [ "$ACTUAL" != "1.5.0" ]; then
            echo "FAIL: expected '1.5.0', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
