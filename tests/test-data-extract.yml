name: Test data extraction
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version-source: variable
          version: '4.1.0'
          data-extract: 'true'
          data-extract-name: 'BUILD_NUMBER'
          data-extract-paths: '${{ github.workspace }}/actions/hardened/HardNorth--github-version-generate/v1.4.0/tests/fixtures/data-extract.properties'
          data-extract-patterns: '/(?<=build.number=).+/i'
      - name: Assert CURRENT_VERSION
        env:
          ACTUAL: ${{ steps.action.outputs.CURRENT_VERSION }}
        run: |
          echo "actual CURRENT_VERSION: $ACTUAL"
          if [ "$ACTUAL" != "4.1.0" ]; then
            echo "FAIL: expected CURRENT_VERSION='4.1.0', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
      - name: Assert extracted BUILD_NUMBER output
        env:
          ACTUAL: ${{ steps.action.outputs.BUILD_NUMBER }}
        run: |
          echo "actual BUILD_NUMBER: $ACTUAL"
          if [ "$ACTUAL" != "42" ]; then
            echo "FAIL: expected BUILD_NUMBER='42', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
