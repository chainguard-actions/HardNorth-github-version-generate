name: Test next version minor increment
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version-source: variable
          version: '3.4.5'
          next-version-increment-minor: 'true'
      - name: Assert CURRENT_VERSION unchanged
        env:
          ACTUAL: ${{ steps.action.outputs.CURRENT_VERSION }}
        run: |
          echo "actual CURRENT_VERSION: $ACTUAL"
          if [ "$ACTUAL" != "3.4.5" ]; then
            echo "FAIL: expected '3.4.5', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
      - name: Assert RELEASE_VERSION is 3.4.5
        env:
          ACTUAL: ${{ steps.action.outputs.RELEASE_VERSION }}
        run: |
          echo "actual RELEASE_VERSION: $ACTUAL"
          if [ "$ACTUAL" != "3.4.5" ]; then
            echo "FAIL: expected '3.4.5', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
      - name: Assert NEXT_VERSION minor incremented (patch reset to 0)
        env:
          ACTUAL: ${{ steps.action.outputs.NEXT_VERSION }}
        run: |
          echo "actual NEXT_VERSION: $ACTUAL"
          # Minor incremented: 3.4.5 -> 3.5.0
          if echo "$ACTUAL" | grep -qE '^3\.5\.0'; then
            echo "PASS: NEXT_VERSION=$ACTUAL"
          else
            echo "FAIL: expected NEXT_VERSION to start with '3.5.0', got '$ACTUAL'"
            exit 1
          fi
