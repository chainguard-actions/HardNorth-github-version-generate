name: Test prerelease version increment
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: version
        uses: .
        with:
          version-source: variable
          version: '1.0.0-alpha.1'
          release-version-cut-prerelease: 'true'
          next-version-increment-prerelease: 'true'
      - name: Assert CURRENT_VERSION
        env:
          ACTUAL: ${{ steps.version.outputs.CURRENT_VERSION }}
        run: |
          echo "CURRENT_VERSION: $ACTUAL"
          if [ "$ACTUAL" != "1.0.0-alpha.1" ]; then
            echo "FAIL: expected '1.0.0-alpha.1', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
      - name: Assert RELEASE_VERSION (prerelease removed)
        env:
          ACTUAL: ${{ steps.version.outputs.RELEASE_VERSION }}
        run: |
          echo "RELEASE_VERSION: $ACTUAL"
          if [ "$ACTUAL" != "1.0.0" ]; then
            echo "FAIL: expected '1.0.0', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
      - name: Assert NEXT_VERSION prerelease incremented
        env:
          ACTUAL: ${{ steps.version.outputs.NEXT_VERSION }}
        run: |
          echo "NEXT_VERSION: $ACTUAL"
          if [ "$ACTUAL" != "1.0.0-alpha.2" ]; then
            echo "FAIL: expected '1.0.0-alpha.2', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
