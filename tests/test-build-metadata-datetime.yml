name: Test build metadata with custom datetime
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version-source: variable
          version: '2.3.4'
          release-version-generate-build-metadata: 'true'
          release-version-build-metadata-pattern: 'build.{date[YYYY-MM-DD]}'
          release-version-build-metadata-datetime: '2024-06-15T12:00:00Z'
      - name: Assert CURRENT_VERSION
        env:
          ACTUAL: ${{ steps.action.outputs.CURRENT_VERSION }}
        run: |
          echo "actual CURRENT_VERSION: $ACTUAL"
          if [ "$ACTUAL" != "2.3.4" ]; then
            echo "FAIL: expected CURRENT_VERSION '2.3.4' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
      - name: Assert RELEASE_VERSION contains build metadata with custom date
        env:
          ACTUAL: ${{ steps.action.outputs.RELEASE_VERSION }}
        run: |
          echo "actual RELEASE_VERSION: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: RELEASE_VERSION is empty"
            exit 1
          fi
          # Should contain the custom date from release-version-build-metadata-datetime
          if echo "$ACTUAL" | grep -q "2024-06-15"; then
            echo "PASS: RELEASE_VERSION contains expected date '2024-06-15': $ACTUAL"
          else
            echo "FAIL: expected RELEASE_VERSION to contain '2024-06-15' but got '$ACTUAL'"
            exit 1
          fi
