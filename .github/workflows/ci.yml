name: CI Build

on:
  push:
    branches:
      - '*'
      - '!main'
    paths-ignore:
      - README.md
      - CHANGELOG.md

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci
      - name: Test with Jest
        run: npm run test
      - name: Test with ESLint
        run: npm run lint
      - name: Build with npm
        run: npm run build
