name: Test next version patch increment
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version-source: variable
          version: '1.2.3-SNAPSHOT'
          next-version-increment-patch: 'true'
      - name: Assert CURRENT_VERSION unchanged
        env:
          ACTUAL: ${{ steps.action.outputs.CURRENT_VERSION }}
        run: |
          echo "actual CURRENT_VERSION: $ACTUAL"
          if [ "$ACTUAL" != "1.2.3-SNAPSHOT" ]; then
            echo "FAIL: expected '1.2.3-SNAPSHOT', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
      - name: Assert RELEASE_VERSION is 1.2.3
        env:
          ACTUAL: ${{ steps.action.outputs.RELEASE_VERSION }}
        run: |
          echo "actual RELEASE_VERSION: $ACTUAL"
          if [ "$ACTUAL" != "1.2.3" ]; then
            echo "FAIL: expected '1.2.3', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
      - name: Assert NEXT_VERSION patch incremented
        env:
          ACTUAL: ${{ steps.action.outputs.NEXT_VERSION }}
        run: |
          echo "actual NEXT_VERSION: $ACTUAL"
          # Patch incremented: 1.2.3 -> 1.2.4 (with or without SNAPSHOT suffix)
          if echo "$ACTUAL" | grep -qE '^1\.2\.4'; then
            echo "PASS: NEXT_VERSION=$ACTUAL"
          else
            echo "FAIL: expected NEXT_VERSION to start with '1.2.4', got '$ACTUAL'"
            exit 1
          fi
