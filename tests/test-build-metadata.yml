name: Test build metadata generation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version-source: variable
          version: '1.0.0-SNAPSHOT'
          release-version-generate-build-metadata: 'true'
          release-version-build-metadata-pattern: 'build.{date}.{hash}'
      - name: Assert CURRENT_VERSION unchanged
        env:
          ACTUAL: ${{ steps.action.outputs.CURRENT_VERSION }}
        run: |
          echo "actual CURRENT_VERSION: $ACTUAL"
          if [ "$ACTUAL" != "1.0.0-SNAPSHOT" ]; then
            echo "FAIL: expected '1.0.0-SNAPSHOT', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
      - name: Assert RELEASE_VERSION contains build metadata
        env:
          ACTUAL: ${{ steps.action.outputs.RELEASE_VERSION }}
        run: |
          echo "actual RELEASE_VERSION: $ACTUAL"
          # Should be like: 1.0.0+build.2024-01-01.abcdef12
          if echo "$ACTUAL" | grep -qE '^1\.0\.0\+build\.'; then
            echo "PASS: RELEASE_VERSION=$ACTUAL"
          else
            echo "FAIL: expected RELEASE_VERSION to match '1.0.0+build.*', got '$ACTUAL'"
            exit 1
          fi
