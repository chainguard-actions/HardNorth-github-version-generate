name: Test data extraction
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version-source: variable
          version: '1.0.0'
          data-extract: 'true'
          data-extract-name: 'app_name'
          data-extract-paths: '${{ github.workspace }}/tests/fixtures/app.properties'
          data-extract-patterns: '/(?<=app\.name=).+/i'
      - name: Assert CURRENT_VERSION is set
        env:
          ACTUAL: ${{ steps.action.outputs.CURRENT_VERSION }}
        run: |
          echo "actual CURRENT_VERSION: $ACTUAL"
          if [ "$ACTUAL" != "1.0.0" ]; then
            echo "FAIL: expected '1.0.0', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
      - name: Assert extracted data output exists
        env:
          APP_NAME: ${{ steps.action.outputs.APP_NAME }}
        run: |
          echo "actual APP_NAME: $APP_NAME"
          if [ "$APP_NAME" != "MyApplication" ]; then
            echo "FAIL: expected 'MyApplication', got '$APP_NAME'"
            exit 1
          fi
          echo "PASS"
