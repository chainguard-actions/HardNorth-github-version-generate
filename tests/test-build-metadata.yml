name: Test build metadata generation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version-source: variable
          version: '3.0.0-SNAPSHOT'
          release-version-generate-build-metadata: 'true'
          release-version-build-metadata-pattern: 'build.{date}.{hash}'
      - name: Assert RELEASE_VERSION contains build metadata
        env:
          ACTUAL: ${{ steps.action.outputs.RELEASE_VERSION }}
        run: |
          echo "actual RELEASE_VERSION: $ACTUAL"
          # Should start with the base version and contain '+' for build metadata
          if [[ "$ACTUAL" != 3.0.0+* ]]; then
            echo "FAIL: expected RELEASE_VERSION to start with '3.0.0+' but got '$ACTUAL'"
            exit 1
          fi
          # Should contain 'build.' in the metadata
          if [[ "$ACTUAL" != *build.* ]]; then
            echo "FAIL: expected RELEASE_VERSION to contain 'build.' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
      - name: Assert CURRENT_VERSION unchanged
        env:
          ACTUAL: ${{ steps.action.outputs.CURRENT_VERSION }}
        run: |
          echo "actual CURRENT_VERSION: $ACTUAL"
          if [ "$ACTUAL" != "3.0.0-SNAPSHOT" ]; then
            echo "FAIL: expected '3.0.0-SNAPSHOT' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
